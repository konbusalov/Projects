{% extends "base.html" %}

{% block title %}Make Deposit{% endblock %}

{% block content %}
    <h3>Make Deposit</h3>
    <form method="POST">
        {%csrf_token%}
        <p>
            <label>Sum</label>
            <input type="number" min="1" max="1000000" step="10" name="amount" value="1">
        </p>
        <input type="submit" value="Confirm">
    </form>
{%endblock%}
