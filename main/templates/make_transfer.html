{% extends "base.html" %}

{% block title %}Make Deposit{% endblock %}

{% block content %}
    <h3>Make Transfer</h3>
    <form method="POST">
        {%csrf_token%}
        <p>
            <label>Amount</label>
            <input type="number" min="1" max="1000000" step="1" name="amount" value="1">
        </p>
        <p>
            <label>Account number to send to:</label>
            <div>
                <input type="text" name="to_account" value="" />
            </div>
        </p>
        <input type="submit" value="Confirm">
        
        
    </form>
{%endblock%}
